<div id="network-activity-bar" class="network-activity-bar" aria-hidden="true"></div>
<div id="network-activity-domain" class="network-activity-domain" aria-hidden="true"></div>

<!-- Same #context-toast as dashboard-header.html's context-window -- both
     hover/focus tooltips ([data-toast] anywhere on the page) and action
     results (showActionToast in app.ts, for what used to be
     #wallet-result/#loaded-identity-message) render here now regardless of
     route, so this needs to exist on the home header too, not just
     dashboard's. header.home-header-root is itself a valid containing block
     (position: sticky), so this overlays the whole bar the same "opaque,
     replaces what's under it for the moment" way it covers just the
     omnibox column over there. -->
<div id="context-toast" class="context-toast" aria-hidden="true"></div>

<!-- Home page header: wordmark + subtitle + lock icon (no context window) -->
<div class="home-header-left">
</div>
<div class="site-header-brand">
  <button type="button" id="site-header-logo-home" class="site-header-logo">
    <!--
    <svg class="site-header-logo-mark" viewBox="0 0 60 90" aria-hidden="true">
      <path d="M19,16 Q8,45 19,74" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"></path>
      <path d="M45,16 Q34,45 45,74" fill="none" stroke="currentColor" stroke-width="15" stroke-linecap="round"></path>
    </svg>
    -->
    <span class="site-header-logo-text">〃dito</span>
  </button>
  <p class="site-header-subtitle">A digital ID toolkit</p>
</div>
<div class="home-header-right">
  <a
    class="header-download"
    href="/dito.html"
    download="dito.html"
    aria-label="Download dito (single-file app)"
    data-toast="download"
  >
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">

      <polyline points="7 10 12 15 17 10"></polyline>
      <line x1="12" y1="15" x2="12" y2="3"></line>

  </a>
  <a id="creation-about-link" class="header-download header-about" href="/about" aria-label="Docs" data-toast="docs">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
      <polyline points="14 2 14 8 20 8"></polyline>
      <line x1="16" y1="13" x2="8" y2="13"></line>
      <line x1="16" y1="17" x2="8" y2="17"></line>
    </svg>
  </a>
</div>
<span class="floating-lock-wrap">
  <span
    id="wallet-login-status"
    class="hidden"
    data-state="out"
    aria-live="polite"
  ></span>
  <button
    id="lock-toggle"
    class="lock-item hidden"
    type="button"
    aria-label="Locked"
    data-locked="true"
  >
    <svg
      id="lock-toggle-icon"
      viewBox="0 0 24 24"
      width="18"
      height="18"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="4" y="11" width="16" height="10" rx="2"></rect>
      <path id="lock-toggle-shackle" d="M8 11V7a4 4 0 0 1 8 0v4"></path>
    </svg>
  </button>
</span>
