<section
  id="wallet-authorize-panel"
  class="wallet-session wallet-authorize-card hidden"
  aria-live="polite"
>
  <div class="system-sheet-scroll">
  <h3 class="wallet-authorize-heading">
    <span class="wallet-authorize-heading-prefix">Authorize</span>
    <span id="wallet-authorize-title" class="wallet-authorize-heading-title">application</span>
    <button
      type="button"
      id="wallet-authorize-cancel"
      class="wallet-authorize-close"
      aria-label="Cancel"
    >
      <svg
        viewBox="0 0 24 24"
        width="16"
        height="16"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M18 6 6 18"></path>
        <path d="m6 6 12 12"></path>
      </svg>
    </button>
  </h3>
  <p id="wallet-authorize-status" class="hint"></p>
  <!-- What is being approved, always visible: read it, then press Approve. -->
  <div id="wallet-authorize-details">
    <dl>
      <dt>Name</dt>
      <dd id="wallet-authorize-name-row">
        <span id="wallet-authorize-name"></span>
        <button type="button" id="wallet-authorize-edit-device" class="wallet-authorize-edit" aria-label="Edit name">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 20h9"></path>
            <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"></path>
          </svg>
        </button>
        <input
          id="wallet-authorize-device-label"
          class="hidden"
          maxlength="160"
          aria-label="Name (stored only in this browser)"
          autocomplete="off"
          data-protonpass-ignore="true"
          data-1p-ignore
          data-lpignore="true"
          data-bwignore
          data-form-type="other"
          placeholder="e.g. My Forgejo"
        />
      </dd>
      <dt>App</dt>
      <dd id="wallet-authorize-app"></dd>
      <dt>Via</dt>
      <dd id="wallet-authorize-device"></dd>
      <dt>Access</dt>
      <dd id="wallet-authorize-scope"></dd>
      <dt id="wallet-authorize-didcomm-label" class="hidden">DIDComm endpoint</dt>
      <dd id="wallet-authorize-didcomm" class="hidden"></dd>
      <dt id="wallet-authorize-derived-label" class="hidden">Derived data</dt>
      <dd id="wallet-authorize-derived" class="hidden"></dd>
      <dt>Expires</dt>
      <dd id="wallet-authorize-expires"></dd>
    </dl>
  </div>
  <div class="actions">
    <button id="wallet-authorize-approve" class="primary wallet-authorize-approve" type="button">
      Approve
    </button>
  </div>
  </div>
</section>
